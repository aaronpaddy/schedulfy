# Render Blueprint for Schedulfy
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo
#
# After the first deploy, set on the schedulfy-api service:
#   OPENAI_API_KEY  -> your OpenAI key
#   CORS_ORIGINS    -> https://schedulfy-web.onrender.com
#
# The frontend needs no URL variable: it calls /api on its own domain, which
# the rewrite rule below proxies to the API. That keeps the session cookie
# first-party so refreshing the page does not log users out.

databases:
  - name: schedulfy-db
    databaseName: schedulfy
    user: schedulfy
    plan: free

services:
  # ---------- Flask API ----------
  - type: web
    name: schedulfy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      # numpy 1.26 and psycopg2-binary ship no wheels for Python 3.13,
      # which is Render's current default. Pinning 3.11 keeps the build
      # on prebuilt wheels instead of compiling from source.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: schedulfy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      # Set these in the dashboard - they are secret or not known until deploy.
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ---------- React frontend ----------
  - type: web
    name: schedulfy-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # Render sets CI=true, which makes react-scripts treat lint warnings
      # as build failures. Unset it so warnings stay warnings.
      - key: CI
        value: "false"
      # REACT_APP_API_URL is intentionally unset: production builds default
      # to same-origin '/api', which the rewrite above proxies to the backend.
      # Setting it to the backend domain reintroduces the cross-site cookie
      # problem. Delete any existing value in the dashboard.
    routes:
      # Proxy the API through this domain so it is same-origin with the app.
      # Without this the session cookie is third-party (onrender.com is a
      # public suffix, so the two subdomains are different sites), and Safari
      # and Chrome incognito drop it - users get logged out on refresh.
      # This rule must come before the SPA catch-all below.
      # If you rename the API service, update this URL to match.
      - type: rewrite
        source: /api/*
        destination: https://schedulfy-api.onrender.com/api/*
      # React Router owns the remaining paths; serve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
